"""
-->
<html lang="en">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<body>
  <h1>Matplotlib in Pyodide (v0.25.1)</h1>
  <div id="output">Loading...</div>
  <img id="plot" alt="Matplotlib Plot"/>

  <script>
    async function main() {
      const output = document.getElementById("output");
      output.textContent = "Initializing Pyodide...";

      const pyodide = await loadPyodide();
      output.textContent = "Installing packages...";

      await pyodide.loadPackage("micropip");
      await pyodide.runPythonAsync(`
import micropip
await micropip.install(["matplotlib", "numpy"])
`);

      output.textContent = "Generating plot...";

      await pyodide.runPythonAsync(`
import matplotlib
matplotlib.use("Agg")

import matplotlib.pyplot as plt
import numpy as np
import io, base64
from js import document

# Generate data
y = np.linspace(0, 2 * np.pi, 100)
x = np.sin(y)

# Create figure
fig, ax = plt.subplots()
ax.plot(x, y)
ax.set_title("Sine Wave via Agg Backend")

# Save to buffer
buf = io.BytesIO()
fig.savefig(buf, format="png")
buf.seek(0)

# Encode to base64
img_base64 = base64.b64encode(buf.read()).decode("utf-8")
document.getElementById("plot").src = f"data:image/png;base64,{img_base64}"
`);

      output.textContent = "Plot rendered successfully.";
    }

    main();
  </script>
</body>
</html>
