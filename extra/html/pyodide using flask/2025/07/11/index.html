"""
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Simulated Flask in Pyodide (POST)</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
</head>
<body>
  <h1>POST to Flask (simulated via Pyodide)</h1>
  <button onclick="simulatePost()">Send POST Request</button>
  <pre id="output"></pre>

<script>
async function simulatePost() {
  const pyodide = await loadPyodide();

  // Install Flask (via micropip)
  await pyodide.loadPackage('micropip');
  await pyodide.runPythonAsync(`
import micropip
await micropip.install("flask")
  `);

  // Run simulated Flask POST logic
  const code = `
from flask import Flask, request, jsonify

app = Flask(__name__)

@app.route("/submit", methods=["POST"])
def submit():
    data = request.get_json()
    name = data.get("name", "Anonymous")
    return jsonify(message=f"Received POST from {name}")

# simulate a POST request
with app.test_client() as client:
    response = client.post("/submit", json={"name": "Pyodide User"})
    result = response.get_json()["message"]
`;

  await pyodide.runPythonAsync(code + "\nimport js; js.document.getElementById('output').textContent = result");
}
</script>
</body>
</html>
