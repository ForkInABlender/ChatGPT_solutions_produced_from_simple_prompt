<!DOCTYPE html>
<html>
<head>
    <title>PyBrain3 with Pyodide</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.18.1/full/pyodide.js"></script>
</head>
<body>
    <h1>PyBrain3 with Pyodide in Flask</h1>
    <script>
        async function loadPyodideAndPackages() {
            let pyodide = await loadPyodide({
                indexURL: "https://cdn.jsdelivr.net/pyodide/v0.18.1/full/"
            });
            await pyodide.loadPackage(['numpy', 'scipy', 'micropip']);
            await pyodide.runPythonAsync(`
                import micropip
                await micropip.install('pybrain3')
                import numpy as np
                import scipy
                scipy.reshape = np.reshape
                scipy.dot = np.dot
                scipy.outer = np.outer
                scipy.where = np.where
                scipy.array = np.array
                scipy.exp = np.exp
                scipy.zeros = np.zeros
                scipy.size = np.size
                scipy.mat = np.mat
                scipy.ndarray = np.ndarray
                scipy.eye = np.eye
                scipy.tanh = np.tanh
                scipy.clip = np.clip
                scipy.log = np.log
                scipy.sqrt = np.sqrt
                scipy.power = np.power
                scipy.pi = np.pi
                scipy.tan = np.tan
                scipy.diag = np.diag
                scipy.rand = np.random.rand
                scipy.random = np.random
                scipy.mgrid = np.mgrid
                scipy.tile = np.tile
                scipy.floor = np.floor
                scipy.sum = np.sum
                import pybrain3
            `);
            console.log('PyBrain3 is ready to use with Pyodide!');
        }

        loadPyodideAndPackages();
    </script>
</body>
</html>
