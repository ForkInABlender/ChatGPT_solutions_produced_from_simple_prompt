  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.1/brython.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/brython@3.11.1/brython_stdlib.js"></script>
</head>
<body onload="brython()">

<script type="text/python">
class Integrator:
    def __init__(self, y0, deriv, t, dt):
        # Bind variables to self:
        self.deriv = deriv
        self.y = y0
        self.n = len(self.y)
        self.dt = dt
        self.t = t

        # Create scratch arrays to compute the derivatives:
        self._ctor = type(self.y)
        
        self._w = [0] * self.n
        self._k1 = [0] * self.n
        self._k2 = [0] * self.n
        self._k3 = [0] * self.n
        self._k4 = [0] * self.n

    def step(self):
        self.deriv(self._k1, self.y, self.t)

        for i in range(self.n):
            self._w[i] = self.y[i] + self._k1[i] * self.dt * 0.5

        self.deriv(self._k2, self._w, self.t + self.dt * 0.5)

        for i in range(self.n):
            self._w[i] = self.y[i] + self._k2[i] * self.dt * 0.5

        self.deriv(self._k3, self._w, self.t + self.dt * 0.5)

        for i in range(self.n):
            self._w[i] = self.y[i] + self._k3[i] * self.dt

        self.deriv(self._k4, self._w, self.t + self.dt)

        dto6 = self.dt / 6.0
        for i in range(self.n):
            self.y[i] += dto6 * (self._k1[i] + 2 * self._k2[i] + 2 * self._k3[i] + self._k4[i])

        self.t += self.dt
        return self

    def steps(self, n):
        for step in range(n):
            self.step()
        return self


def IntegratorFactory(y0, deriv, t, dt):
    return Integrator(y0, deriv, t, dt)


# Define the derivative function based on the equation provided
def deriv(dvdt, v, t, params):
    molwt, logp, tau = params
    # Assuming we have a single differential equation, apply it to all components
    for i in range(len(v)):
        dvdt[i] = (molwt + logp - v[i]) / tau

# Initial conditions and parameters (to be set at runtime)
y0 = [0.0]  # Initial value for v (as a 1D list for simplicity)
t = 0.0     # Initial time
dt = 0.1    # Time step
n_steps = 100  # Number of steps to integrate

# User provides values for the molecular weight, log partition coefficient, and tau
molwt = float(input("Enter molwt: "))  # Example: 100
logp = float(input("Enter logp: "))    # Example: 2
tau = float(input("Enter tau: "))      # Example: 5

# Create a tuple for parameters
params = (molwt, logp, tau)

# Modify the deriv function by binding params using a lambda
def deriv_with_params(dvdt, v, t):
    deriv(dvdt, v, t, params)

# Create an Integrator instance using the factory
integrator = IntegratorFactory(y0, deriv_with_params, t, dt)

# Perform the integration
for step in range(n_steps):
    integrator.step()
    print(f"Step {step}: v = {integrator.y[0]}, t = {integrator.t}")
</script>
