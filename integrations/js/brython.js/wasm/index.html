<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/brython@3.11.3/brython_stdlib.js"></script>

<body onload="brython()">

    <script type="text/python">
from browser import window, document

wasm_bytes = bytearray([0x00, 0x61, 0x73, 0x6D, 0x01, 0x00, 0x00, 0x00, 0x01, 0x07, 0x01, 0x60, 0x02, 0x7F, 0x7F, 0x01, 0x7F, 0x03, 0x02, 0x01, 0x00, 0x07, 0x07, 0x01, 0x03, 0x61, 0x64, 0x64, 0x00, 0x00, 0x0A, 0x09, 0x01, 0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0x6A, 0x0B])

uint8_array = window.Uint8Array.new(len(wasm_bytes))
for i in range(len(wasm_bytes)):
    uint8_array[i] = wasm_bytes[i]
wasm_instance = window.WebAssembly.Instance.new(window.WebAssembly.Module.new(uint8_array), {})

print(wasm_instance.exports.add(5,3))

    </script>
